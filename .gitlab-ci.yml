workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always


variables:
  DOCKER_REGISTRY: wearestancer
  PYTHON_VERSION: "3.10"


Create archive:
  stage: deploy

  image: ${DOCKER_REGISTRY}/python:${PYTHON_VERSION}

  before_script:
    - python3 -V
    - pip -V
    - pipenv --version
    - pipenv install
    - pipenv requirements > ./requirements.txt

  script:
    - pipenv run create-archive

  artifacts:
    paths:
      - '*.zip'

Black:
  stage: test

  image: ${DOCKER_REGISTRY}/python:${PYTHON_VERSION}

  before_script:
    - python3 -V
    - pip -V
    - pipenv --version
    - pipenv install --dev

  script:
    - pipenv run python3 -m black --check ./ || true
    - pipenv run python3 -m black --diff ./ > black_diff.txt

  artifacts:
    paths:
      - black_diff.txt

Isort:
  stage: test

  image: ${DOCKER_REGISTRY}/python:${PYTHON_VERSION}
  before_script:
    - python3 -V
    - pip -V
    - pipenv --version
    - pipenv install --dev

  script:
    - pipenv run python3 -m isort --check ./ || true
    - pipenv run python3 -m isort --diff ./ > isort_diff.txt
  artifacts:
    paths:
      - isort_diff.txt
